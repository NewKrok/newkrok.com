name: Prod CI

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: List files after checkout
        run: |
          pwd
          ls
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        id: build
        run: npm ci
      - run: npm run build
      # The Hitch & Park leaderboard's PHP reads its database and secrets
      # from build/api/hitch-park/config.php (never in the repository).
      - name: Write leaderboard config
        run: node scripts/write-lb-config.js
        env:
          LB_DB_NAME: ${{ secrets.LB_DB_NAME }}
          LB_DB_USER: ${{ secrets.LB_DB_USER }}
          LB_DB_PASS: ${{ secrets.LB_DB_PASS }}
          LB_RUN_SECRET: ${{ secrets.LB_RUN_SECRET }}
          LB_VERIFY_TOKEN: ${{ secrets.LB_VERIFY_TOKEN }}
      - name: List files after build
        run: |
          pwd
          ls
      - name: Create a Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: FTP Deploy to newkrok.com
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          local-dir: "./build/"
          server-dir: ./
          server: ${{secrets.FTP_SERVER}}
          username: ${{secrets.FTP_USER_NAME}}
          password: ${{secrets.FTP_PASSWORD}}
          exclude: .git* - .git*/** - .vscode/** - .github/** - *.gpg - *.keys
          dangerous-clean-slate: false
      # Creates any leaderboard table that is missing (safe to repeat).
      - name: Leaderboard tables
        run: |
          curl -fsS -X POST -H "X-Verify-Token: $LB_VERIFY_TOKEN" -H "Content-Type: application/json" -d '{}' https://newkrok.com/api/hitch-park/install.php
        env:
          LB_VERIFY_TOKEN: ${{ secrets.LB_VERIFY_TOKEN }}
